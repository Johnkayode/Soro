[project]
name = "soro"
version = "0.1.0"
description = "Add your description here"
readme = { file = "README.MD", content-type = "text/markdown" }
authors = [
    { name = "nerdthejohn", email = "jk.shodipo@gmail.com" }
]
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=6.0.3",
    "scipy>=1.10.1",
    "sounddevice>=0.5.6",
]

[project.scripts]
soro = "soro.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
